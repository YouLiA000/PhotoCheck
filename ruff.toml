# ruff 配置（2026-11-22 新增）
#
# 在此之前，仓库里散落着 238 处 PLC0415、191 处 F401 之类的 `# noqa`，
# 说明实际在跑 ruff，但规则集只存在于某个人的本机配置里——
# 换台机器，同一份代码的"是否合规"就变了。
#
# 这里只固定**能通过**的那一档，不追求最严：
# 规则集偏大而全，第一天就红一片，很快就会被人用 `--no-verify` 绕过，比没有更糟。
# 等基线清零后再逐步收紧。
#
# 当前基线：`ruff check . --exclude app/vendor` → **25 条**
#   B007 ×3、F841 ×3、E741 ×2、F541 ×1、B008 ×1、F403 ×1 等。
# 这 25 条**没有**写进 ignore，是故意的——ignore 会让它们永远消失。
# 计划：PR #2 合并后（避免与 B 的分支冲突）一次性清零，然后才把它接进 pre-commit。

line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "B"]

ignore = [
    "E501",  # 长行：注释与中文文案占多数，110 已够用，超出的多为不可断字符串
    "E402",  # 脚本需要先改 sys.path 再 import，属有意为之
    "E702",  # 少量 `a; b` 紧凑写法，可读性未受损
    "B905",  # zip(strict=) 是 3.10+ 语义变更，需逐个确认行为后再改
]

[lint.per-file-ignores]
"**/tests/**" = [
    "B017",  # assertRaises(Exception) 在守卫测试里有意义：断言"任何异常都算拦下"
]
"dataset/tools/**" = [
    "F403",  # 生成器脚本用 star import 拉常量表
]
